<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Free Claude Code Admin Login</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/assets/admin.css" />
  </head>
  <body class="login-body">
    <main class="login-page">
      <form id="loginForm" class="login-card">
        <div class="login-copy">
          <div class="brand-mark">FC</div>
          <div>
            <h1>Free Claude Code</h1>
            <p>Enter the local admin password to manage this FCC server.</p>
          </div>
        </div>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" />
        <button class="primary-button" type="submit">Login</button>
        <div id="loginMessage" class="login-message" aria-live="polite"></div>
      </form>
    </main>
    <script src="/admin/assets/login.js"></script>
  </body>
</html>
